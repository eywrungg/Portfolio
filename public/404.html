<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Opening portfolio…</title>
    <script>
      ;(() => {
        const repositoryBase = '/Portfolio'
        const requestedPath = window.location.pathname.startsWith(repositoryBase)
          ? window.location.pathname.slice(repositoryBase.length) || '/'
          : '/'
        const redirectPath = `${requestedPath}${window.location.search}`
        const destination = `${repositoryBase}/?redirect=${encodeURIComponent(redirectPath)}${window.location.hash}`

        window.location.replace(destination)
      })()
    </script>
  </head>
  <body>
    <p>Opening the portfolio…</p>
  </body>
</html>
